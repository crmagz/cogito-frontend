name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  verify:
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1.1.1
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: workbench/
      container-registry: ghcr
      ghcr-repository: crmagz/workbench
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      environment: ci

  helm:
    permissions:
      contents: read
    uses: crmagz/forge/.github/workflows/validate-helm.yml@helm/v1
    with:
      forge-task-ref: helm/v1
      chart-directory: chart
      values-files: |-
        chart/values.yaml
        chart/values-production.yaml
        chart/values-validation.yaml
      kubernetes-version: "1.32.0"
      kind-test: true
      kind-cluster-name: workbench-chart
      kind-image: workbench:ci
      kind-dockerfile: Dockerfile
      kind-build-context: .
      kind-values-files: |-
        chart/values.yaml
        chart/values-kind-validation.yaml
      kind-test-secret-name: chart-validation-relay
      kind-test-secret-key: token
      kind-test-secret-value: not-used
