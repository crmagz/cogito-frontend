name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  verify:
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      working-directory: .
      node-version: "24"
      # The reusable Forge workflow skips its publish job when no target is configured.
      environment: ci
