name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pin the current Forge release commit; update only with a reviewed release.
    uses: crmagz/forge/.github/workflows/build-node.yml@d9687aa7da986d3431f10e67b22a14f92bb95b5d
    with:
      working-directory: .
      node-version: "22"
      # The reusable Forge workflow skips its publish job when no target is configured.
      environment: ci
