name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: frontend/
      ecr-repository: cogito-frontend
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      # Forge owns validation, semantic versioning, image publishing, and
      # release creation for this repository.
      environment: ci

  verify-main:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: frontend/
      ecr-repository: cogito-frontend
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      environment: ci
