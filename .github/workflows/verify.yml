name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pin the reviewed no-publish workflow commit until it is released as releases/v1.
    uses: crmagz/forge/.github/workflows/build-node.yml@671730c2e348ad5821d2750863d09c43088715db
    with:
      working-directory: .
      node-version: "22"
      # The reusable Forge workflow skips its publish job when no target is configured.
      environment: ci
