name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  verify:
    # Pin the reviewed no-publish Forge workflow commit until its release tag advances.
    uses: crmagz/forge/.github/workflows/build-node.yml@671730c2e348ad5821d2750863d09c43088715db
    with:
      working-directory: .
      node-version: "22"
      # The reusable Forge workflow skips its publish job when no target is configured.
      environment: ci
