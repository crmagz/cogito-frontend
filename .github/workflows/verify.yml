name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: frontend/
      ecr-repository: cogito-frontend
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      # Forge owns validation, semantic versioning, image publishing, and
      # release creation for this repository.
      environment: ci

  verify-main:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: frontend/
      ecr-repository: cogito-frontend
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      environment: ci

  helm:
    permissions:
      contents: read
    uses: crmagz/forge/.github/workflows/validate-helm.yml@9066e6a484118095964bdd7ebdfea480ac3f1f4e
    with:
      chart-directory: chart
      values-files: |-
        chart/values.yaml
        chart/values-production.yaml
        chart/values-validation.yaml
      kubernetes-version: "1.32.0"
      kind-test: true
      kind-cluster-name: cogito-workbench-chart
      kind-image: cogito-workbench:ci
      kind-dockerfile: Dockerfile
      kind-build-context: .
      kind-values-files: |-
        chart/values.yaml
        chart/values-kind-validation.yaml
      kind-bootstrap-script: |-
        kubectl --namespace chart-validation create secret generic chart-validation-relay --from-literal=token=not-used
