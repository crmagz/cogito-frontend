name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  verify:
    # Immutable Forge feature revision. Replace with its released exact tag
    # after the Forge change merges.
    uses: crmagz/forge/.github/workflows/build-node.yml@44502df8b58af18d30eee518287f657c00e7ea80
    with:
      working-directory: .
      node-version: "24"
      tag-prefix: frontend/
      container-registry: ghcr
      ghcr-repository: crmagz/cogito-workbench
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      # Forge owns validation, semantic versioning, image publishing, and
      # release creation for this repository.
      environment: ci

  helm:
    permissions:
      contents: read
    uses: crmagz/forge/.github/workflows/validate-helm.yml@helm/v1
    with:
      # Keep the Taskfile source aligned with the callable workflow release.
      forge-task-ref: helm/v1
      chart-directory: chart
      values-files: |-
        chart/values.yaml
        chart/values-production.yaml
        chart/values-validation.yaml
      kubernetes-version: "1.32.0"
      kind-test: true
      kind-cluster-name: cogito-workbench-chart
      kind-image: cogito-workbench:ci
      kind-dockerfile: Dockerfile
      kind-build-context: .
      kind-values-files: |-
        chart/values.yaml
        chart/values-kind-validation.yaml
      kind-test-secret-name: chart-validation-relay
      kind-test-secret-key: token
      kind-test-secret-value: not-used
