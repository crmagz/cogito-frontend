{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cogito-workbench.fullname" . }}
  labels:
    {{- include "cogito-workbench.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cogito-workbench.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: http
{{- end }}
