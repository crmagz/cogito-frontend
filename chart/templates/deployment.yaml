{{- $mode := required "relay.mode must be session or static" .Values.relay.mode }}
{{- if and .Values.global.production (ne $mode "session") }}
{{- fail "relay.mode=static is not permitted when global.production=true; configure an OIDC session relay" }}
{{- end }}
{{- if and .Values.global.production (not .Values.image.digest) }}
{{- fail "image.digest is required when global.production=true" }}
{{- end }}
{{- if and (ne $mode "session") (ne $mode "static") }}
{{- fail "relay.mode must be session or static" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cogito-workbench.fullname" . }}
  labels:
    {{- include "cogito-workbench.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "cogito-workbench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cogito-workbench.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "cogito-workbench.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: workbench
          image: {{ include "cogito-workbench.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COGITO_RELAY_MODE
              value: {{ $mode | quote }}
            {{- if eq $mode "session" }}
            - name: COGITO_SESSION_RELAY_URL
              value: {{ required "relay.session.upstreamUrl is required for session mode" .Values.relay.session.upstreamUrl | quote }}
            {{- else }}
            - name: COGITO_UPSTREAM_URL
              value: {{ required "relay.static.upstreamUrl is required for static mode" .Values.relay.static.upstreamUrl | quote }}
            - name: COGITO_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "relay.static.existingSecret is required for static mode" .Values.relay.static.existingSecret }}
                  key: {{ .Values.relay.static.tokenKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
