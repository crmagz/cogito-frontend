global:
  production: true

image:
  # The deployment pipeline supplies the immutable GHCR image, for example
  # ghcr.io/crmagz/cogito-workbench.
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

relay:
  mode: session
  # Set to an OIDC-aware, same-cluster session relay that owns browser sessions
  # and obtains API credentials. This must not be the Cogito API directly.
  session:
    upstreamUrl: ""
    readinessUrl: ""

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

deployment:
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

networkPolicy:
  enabled: true
  ingress: []
  egress: []

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts: []
  tls: []
